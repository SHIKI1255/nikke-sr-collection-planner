name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - name: Verify release tag matches program version
        run: |
          EXPECTED_TAG="v$(node -p "require('./package.json').version")"
          if [ "$GITHUB_REF_NAME" != "$EXPECTED_TAG" ]; then
            echo "::error::Release tag $GITHUB_REF_NAME does not match program version $EXPECTED_TAG"
            exit 1
          fi
      - name: Install dependencies
        run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Test and build
        run: |
          npm test
          npm run test:browser
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "$GITHUB_REF_NAME"
          "dist/downloads/NIKKE_SR.html"
          "dist/downloads/NIKKE_SR_EN.html"
          "dist/downloads/SHA256SUMS.txt"
          --title "$GITHUB_REF_NAME"
          --generate-notes
