name: Validate and build
description: Shared TypeScript, mathematical, UI and offline publication gate
runs:
  using: composite
  steps:
    - name: Set up Node
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version: 24
        cache: npm
    - name: Install locked dependencies
      shell: bash
      run: npm ci
    - name: Check types
      shell: bash
      run: npm run typecheck
    - name: Run production-core and contract tests
      shell: bash
      run: npm test
    - name: Install Chromium
      shell: bash
      run: npx playwright install --with-deps chromium
    - name: Build and test both offline pages
      shell: bash
      run: npm run test:browser
